<div class="container blog_grid">
    {% for post in site.posts %}
      <ion-card class="flex_post" onclick="openPostModal({{ post | jsonify | escape }})">
        <img class="blog_img" src="{{ post.img }}" loading="lazy" alt="{{ post.title }}">
        <div class="post_box">
          <ion-card-header class="ion-card-header">
            <ion-card-title>{{ post.title }}</ion-card-title>
            <ion-card-subtitle>Author: {{ post.author }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content class="ion-card-content">
            <ion-text color="secondary">{{ post.excerpt }}</ion-text>
          </ion-card-content>
        </div>
      </ion-card>
    {% endfor %}
  </div>

<script>
  async function openPostModal(post) {
    const modal = document.querySelector('#postModal');
    // Konten modal diperbaiki tampilannya tanpa mengubah fungsi
    modal.innerHTML = `
      <ion-header>
        <ion-toolbar>
          <ion-title>${post.title}</ion-title>
          <ion-buttons slot="end">
            <ion-button onclick="document.querySelector('#postModal').dismiss()">
                <ion-icon slot="icon-only" color="danger" name="close-circle-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding modal-blog-content">
        <ion-card class="ion-no-margin">
          <img class="blog_img" src="${post.img}" alt="${post.title}" />
          <ion-card-header>
            <ion-card-title>${post.title}</ion-card-title>
            <ion-card-subtitle>Author: ${post.author}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>${post.content || 'Konten lengkap belum dimasukkan.'}</p>
          </ion-card-content>
        </ion-card>
      </ion-content>
    `;
    await modal.present();
  }
</script>
