---
title: Account
---
  <ion-tab tab="account">
    <div id="account-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>{{ page.title }}</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-no-padding container" fullscreen="true">
		<div class="container">
<div id="dashboard" style="display:none; padding:1rem;">
  <h2>Dashboard</h2>
  <p>Selamat datang, <span id="user-email"></span>!</p>
<ion-button type="button" expand="block" fill="clear" color="medium" onclick="logout()">Keluar</ion-button>
</div>
			<ion-card id="loginBtn">
				<img src="{{ site.baseurl }}/assets/images/login.jpg" alt="login" >
				<ion-footer>
					<ion-toolbar>
						<ion-buttons expand="block">
							<ion-button fill="outline" onclick="openLoginModal()">Login / Register</ion-button>
						</ion-buttons>
					</ion-toolbar>
				</ion-footer>
			</ion-card>
		</div>
      </ion-content>
    </div>
  </ion-tab>
  
  <ion-modal id="loginModal">
  <ion-header>
    <ion-toolbar>
      <ion-title>Login / Register</ion-title>
      <ion-buttons slot="end">
        <ion-button onclick="tutupModal()">
<ion-icon slot="icon-only" name="close-circle-outline" color="danger"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Masuk / Daftar</ion-card-title>
        <ion-card-subtitle>Gunakan email & password</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Email</ion-label>
          <ion-input id="email" type="email" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Password</ion-label>
          <ion-input id="password" type="password" required></ion-input>
        </ion-item>
        <div id="user-info" style="margin-top: 1em;"></div>
      </ion-card-content>
<ion-footer>
	<ion-toolbar>
	<ion-buttons slot="start">
        <ion-button type="button" fill="outline" color="primary" onclick="register()">Daftar</ion-button>
	</ion-buttons>
	<ion-buttons slot="end">
        <ion-button type="button" fill="solid" color="success" onclick="login()">Masuk</ion-button>
	</ion-buttons>
	</ion-toolbar>
</ion-footer>
    </ion-card>
  </ion-content>
</ion-modal>

<script>
  async function openLoginModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      await modal.present();
    } else {
      console.error("Modal tidak ditemukan!");
    }
  }

  function tutupModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      modal.dismiss();
    }
  }
</script>

<script type="module">

window.register = register;
window.login = login;
window.logout = logout;
window.tutupModal = tutupModal;
window.openLoginModal = openLoginModal;

  const auth = firebase.auth();

function register() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(userCredential => {
      userCredential.user.sendEmailVerification()
        .then(() => showAlert("Verifikasi email dikirim! periksa inbox dan folder spam kamu.", "Info"));

      // 🔥 Simpan ke Firestore
      firebase.firestore().collection("users").doc(userCredential.user.uid).set({
        email: email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    })
    .catch(error => showAlert("Register Error: " + error.message , "Error"));
}


  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        if (userCredential.user.emailVerified) {
          showAlert("Login sukses!", "Sukses");
        } else {
          showAlert("Email belum diverifikasi.", "Gagal Masuk");
          auth.signOut();
        }
      }).catch(error => showAlert("Error: " + error.message));
	  
	  tutupModal();
  }

  function logout() {
    auth.signOut().then(() => showAlert("Logout sukses.", "Sukses"));
  }

  auth.onAuthStateChanged(user => {
    const info = document.getElementById("user-info");
    if (user && user.emailVerified) {
  info.innerHTML = `🔐 Logged in as: <strong>${user.email}</strong>`;
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("loginBtn").style.display = "none";
  document.getElementById("user-email").innerText = user.email;
} else {
  info.innerHTML = "🔓 Belum login.";
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginBtn").style.display = "flex";
}

  });
</script>
