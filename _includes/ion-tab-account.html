---
title: Account
---
  <ion-tab tab="account">
    <div id="account-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>{{ page.title }}</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding" fullscreen="true">
<ion-button expand="block" onclick="openLoginModal()">Login / Register</ion-button>
{% include login.html %}
      </ion-content>
    </div>
  </ion-tab>

<script>
  async function openLoginModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      await modal.present();
    } else {
      console.error("Modal tidak ditemukan!");
    }
  }

  function tutupModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      modal.dismiss();
    }
  }
</script>

<!-- Tambahkan ke index.html sebelum </body> -->
<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script type="module">
  const firebaseConfig = {
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
  apiKey: "AIzaSyBDJ3S6xtKv98ol6MyvyU98DfbSOmdm6uE",
  authDomain: "tokoonlen-jekyll.firebaseapp.com",
  projectId: "tokoonlen-jekyll",
  storageBucket: "tokoonlen-jekyll.firebasestorage.app",
  messagingSenderId: "365981993501",
  appId: "1:365981993501:web:06f40c1f1a209888c754f4",
  measurementId: "G-Y6K0E3JK3W"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.createUserWithEmailAndPassword(email, password)
      .then(userCredential => {
        userCredential.user.sendEmailVerification()
          .then(() => alert("Verifikasi email dikirim!"));
      }).catch(error => alert("Error: " + error.message));
  }

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        if (userCredential.user.emailVerified) {
          alert("Login sukses!");
        } else {
          alert("Email belum diverifikasi.");
          auth.signOut();
        }
      }).catch(error => alert("Error: " + error.message));
  }

  function logout() {
    auth.signOut().then(() => alert("Logout sukses."));
  }

  auth.onAuthStateChanged(user => {
    const info = document.getElementById("user-info");
    if (user && user.emailVerified) {
      info.innerHTML = `Logged in as: <strong>${user.email}</strong>`;
    } else {
      info.innerHTML = "Belum login.";
    }
  });
</script>
