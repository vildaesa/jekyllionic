---
title: Account
---
  <ion-tab tab="account">
    <div id="account-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>{{ page.title }}</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding" fullscreen="true">
<ion-button expand="block" onclick="openLoginModal()">Login / Register</ion-button>
{% include login.html %}
      </ion-content>
    </div>
  </ion-tab>

<script>
  async function openLoginModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      await modal.present();
    } else {
      console.error("Modal tidak ditemukan!");
    }
  }

  function dismissModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      modal.dismiss();
    }
  }
</script>

<!-- Tambahkan ke index.html sebelum </body> -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "API_KEY_KAMU",
    authDomain: "PROJECT_ID.firebaseapp.com",
    projectId: "PROJECT_ID",
    storageBucket: "PROJECT_ID.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.createUserWithEmailAndPassword(email, password)
      .then(userCredential => {
        userCredential.user.sendEmailVerification()
          .then(() => alert("Verifikasi email dikirim!"));
      }).catch(error => alert("Error: " + error.message));
  }

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        if (userCredential.user.emailVerified) {
          alert("Login sukses!");
        } else {
          alert("Email belum diverifikasi.");
          auth.signOut();
        }
      }).catch(error => alert("Error: " + error.message));
  }

  function logout() {
    auth.signOut().then(() => alert("Logout sukses."));
  }

  auth.onAuthStateChanged(user => {
    const info = document.getElementById("user-info");
    if (user && user.emailVerified) {
      info.innerHTML = `Logged in as: <strong>${user.email}</strong>`;
    } else {
      info.innerHTML = "Belum login.";
    }
  });

  function tutupModal() {
    document.querySelector('#loginModal').dismiss();
  }
</script>
