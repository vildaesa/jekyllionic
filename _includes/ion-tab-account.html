---
title: Account
---
<ion-tab tab="account">
  <ion-header>
    <ion-toolbar>
      <ion-title>{{ page.title }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-no-padding" fullscreen="true" style="--offset-top: 0px;">
    <!-- Dashboard (tampil setelah login) -->
    <div id="dashboard" style="display: none;">
      <ion-card class="dashboard-card profile-card">
        <div class="profile-header-bg"></div>
        <div class="profile-info-content">
          <div class="avatar-container" id="user-avatar-container">
            <ion-icon name="person-circle" class="profile-avatar-icon" id="user-avatar-icon"></ion-icon>
          </div>
          <div class="profile-details">
            <h2 id="user-display-name">Pelanggan Setia</h2>
            <p id="user-email"></p>
          </div>
        </div>

        <ion-list lines="full" class="profile-menu-list">
          <ion-item button>
            <ion-icon name="receipt-outline" slot="start" color="primary"></ion-icon>
            <ion-label>Riwayat Pesanan</ion-label>
            <ion-note slot="end" color="medium">0 Pesanan</ion-note>
          </ion-item>
          <ion-item button>
            <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
            <ion-label>Alamat Pengiriman</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon name="heart-outline" slot="start" color="primary"></ion-icon>
            <ion-label>Favorit Saya</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon name="settings-outline" slot="start" color="primary"></ion-icon>
            <ion-label>Pengaturan Akun</ion-label>
          </ion-item>
        </ion-list>

        <div class="ion-padding">
          <ion-button expand="block" fill="outline" color="danger" onclick="logout()" class="logout-btn">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            Keluar dari Akun
          </ion-button>
        </div>
      </ion-card>
    </div>
    <ion-card id="loginBtn" class="login-prompt-card">
      <div class="image-wrapper">
        <img src="{{ site.baseurl }}/assets/images/login.jpg" alt="login illustration">
      </div>
      <ion-card-content>
        <ion-button expand="block" fill="solid" color="primary" onclick="openLoginModal()">
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          Login / Register
        </ion-button>
      </ion-card-content>
    </ion-card>
  </ion-content>
</ion-tab>



<script>
  async function openLoginModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      await modal.present();
    } else {
      console.error("Modal tidak ditemukan!");
    }
  }

  function tutupModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      modal.dismiss();
    }
  }
</script>

<script type="module">
  const auth = firebase.auth();

  window.register = register;
  window.login = login;
  window.logout = logout;
  window.tutupModal = tutupModal;
  window.openLoginModal = openLoginModal;


  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const fullName = document.getElementById("full_name") ? document.getElementById("full_name").value : "";

    auth.createUserWithEmailAndPassword(email, password)
      .then(userCredential => {
        // Update profile with Display Name
        if (fullName) {
          userCredential.user.updateProfile({
            displayName: fullName
          }).then(() => {
             // Force refresh user data
             auth.updateCurrentUser(auth.currentUser);
          });
        }

        userCredential.user.sendEmailVerification()
          .then(() => showAlert("Verifikasi email dikirim! periksa inbox dan folder spam kamu.", "Info"));

        // Simpan ke Firestore
        firebase.firestore().collection("users").doc(userCredential.user.uid).set({
          email: email,
          displayName: fullName,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      })
      .catch(error => {
        let msg = "Gagal mendaftar.";
        switch (error.code) {
          case 'auth/email-already-in-use': msg = "Email sudah terdaftar."; break;
          case 'auth/invalid-email': msg = "Format email tidak valid."; break;
          case 'auth/weak-password': msg = "Password terlalu lemah."; break;
          default: msg = error.message;
        }
        showAlert(msg, "Error");
      });
  }

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        if (userCredential.user.emailVerified) {
          showAlert("Login sukses!", "Sukses");
        } else {
          showAlert("Email belum diverifikasi.", "Gagal Masuk");
          auth.signOut();
        }
      }).catch(error => {
        let msg = "Gagal login.";
        // Menangani error INVALID_LOGIN_CREDENTIALS atau code lainnya
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.message.includes("INVALID_LOGIN_CREDENTIALS")) {
          msg = "Email atau password salah.";
        } else if (error.code === 'auth/invalid-email') {
          msg = "Format email tidak valid.";
        } else if (error.code === 'auth/too-many-requests') {
          msg = "Terlalu banyak percobaan. Coba lagi nanti.";
        } else {
          msg = error.message;
        }
        showAlert(msg, "Gagal Login");
      });
    tutupModal();
  }

  function logout() {
    auth.signOut().then(() => showAlert("Logout sukses.", "Sukses"));
  }

  auth.onAuthStateChanged(user => {
    const info = document.getElementById("user-info");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");
    const userEmailSpan = document.getElementById("user-email");
    const userNameHeader = document.getElementById("user-display-name");
    const avatarContainer = document.getElementById("user-avatar-container");

    if (user && user.emailVerified) {
      if (info) info.innerHTML = `🔐 Logged in as: <strong>${user.email}</strong>`;
      if (dashboard) dashboard.style.display = "block";
      if (loginBtn) loginBtn.style.display = "none";
      if (userEmailSpan) userEmailSpan.innerText = user.email;

      // Update Name
      if (userNameHeader) {
        userNameHeader.innerText = user.displayName || "Pelanggan Setia";
      }

      // Update Avatar
      if (avatarContainer) {
        if (user.photoURL) {
          avatarContainer.innerHTML = `<img src="${user.photoURL}" class="profile-avatar-img" />`;
        } else {
          avatarContainer.innerHTML = `<ion-icon name="person-circle" class="profile-avatar-icon"></ion-icon>`;
        }
      }
    } else {
      if (info) info.innerHTML = "🔓 Belum login.";
      if (dashboard) dashboard.style.display = "none";
      if (loginBtn) loginBtn.style.display = "block";
    }
  });
</script>
