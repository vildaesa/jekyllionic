---
title: Account
---
<ion-tab tab="account">
  <div id="account-page">
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ page.title }}</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding" fullscreen="true">
      <!-- Dashboard (tampil setelah login) -->
      <div id="dashboard" style="display: none;">
        <ion-card class="dashboard-card">
          <ion-card-header>
            <ion-card-title>
              <ion-icon name="person-circle-outline" size="large"></ion-icon>
              Dashboard
            </ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-item lines="none">
              <ion-icon name="mail-outline" slot="start"></ion-icon>
              <ion-label>Selamat datang, <strong id="user-email"></strong>!</ion-label>
            </ion-item>
            <ion-button expand="block" fill="clear" color="medium" onclick="logout()">
              <ion-icon slot="start" name="log-out-outline"></ion-icon>
              Keluar
            </ion-button>
          </ion-card-content>
        </ion-card>
      </div>

      <!-- Tombol login (tampil sebelum login) -->
      <ion-card id="loginBtn" class="login-prompt-card">
        <div class="image-wrapper">
          <img src="{{ site.baseurl }}/assets/images/login.jpg" alt="login illustration">
        </div>
        <ion-card-content>
          <ion-button expand="block" fill="solid" color="primary" onclick="openLoginModal()">
            <ion-icon slot="start" name="log-in-outline"></ion-icon>
            Login / Register
          </ion-button>
        </ion-card-content>
      </ion-card>
    </ion-content>
  </div>
</ion-tab>

<script>
  // --- fungsi modal (tetap sama) ---
  async function openLoginModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      await modal.present();
    } else {
      console.error("Modal tidak ditemukan!");
    }
  }

  function tutupModal() {
    const modal = document.querySelector('#loginModal');
    if (modal) {
      modal.dismiss();
    }
  }
</script>

<script type="module">
  // Ekspos fungsi ke global window agar bisa dipanggil dari onclick
  window.register = register;
  window.login = login;
  window.logout = logout;
  window.tutupModal = tutupModal;
  window.openLoginModal = openLoginModal;

  const auth = firebase.auth();

  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.createUserWithEmailAndPassword(email, password)
      .then(userCredential => {
        userCredential.user.sendEmailVerification()
          .then(() => showAlert("Verifikasi email dikirim! periksa inbox dan folder spam kamu.", "Info"));

        // Simpan ke Firestore
        firebase.firestore().collection("users").doc(userCredential.user.uid).set({
          email: email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      })
      .catch(error => showAlert("Register Error: " + error.message, "Error"));
  }

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        if (userCredential.user.emailVerified) {
          showAlert("Login sukses!", "Sukses");
        } else {
          showAlert("Email belum diverifikasi.", "Gagal Masuk");
          auth.signOut();
        }
      }).catch(error => showAlert("Error: " + error.message));
    tutupModal();  // seperti kode asli, ditutup langsung (tanpa menunggu)
  }

  function logout() {
    auth.signOut().then(() => showAlert("Logout sukses.", "Sukses"));
  }

  auth.onAuthStateChanged(user => {
    const info = document.getElementById("user-info");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");
    const userEmailSpan = document.getElementById("user-email");

    if (user && user.emailVerified) {
      info.innerHTML = `🔐 Logged in as: <strong>${user.email}</strong>`;
      if (dashboard) dashboard.style.display = "block";
      if (loginBtn) loginBtn.style.display = "none";
      if (userEmailSpan) userEmailSpan.innerText = user.email;
    } else {
      info.innerHTML = "🔓 Belum login.";
      if (dashboard) dashboard.style.display = "none";
      if (loginBtn) loginBtn.style.display = "flex";
    }
  });
</script>
