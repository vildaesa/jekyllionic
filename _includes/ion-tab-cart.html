---
title: Cart
---
  <ion-tab tab="cart">
    <div id="cart-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>{{ page.title }}</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-no-padding container" fullscreen="true">
               {% include keranjang.html %}
      </ion-content>
    </div>
  </ion-tab>

<ion-modal class="custom-fullscreen" id="checkoutModal"></ion-modal>

<script>
async function openCheckoutModal() {
  const modal = document.getElementById('checkoutModal');

  modal.innerHTML = `
    <ion-header translucent>
      <ion-toolbar>
        <ion-title>Checkout</ion-title>
        <ion-buttons slot="end">
          <ion-button onclick="dismissModal()">
<ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
        </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-no-padding">
<ion-card>
    <ion-card-content>
      <form id="checkout-form">
        <ion-item>
          <ion-label position="stacked">First Name</ion-label>
          <ion-input name="first_name" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Last Name</ion-label>
          <ion-input name="last_name" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Email</ion-label>
          <ion-input name="email" type="email" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Street</ion-label>
          <ion-input name="street" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">City</ion-label>
          <ion-input name="city" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">State</ion-label>
          <ion-input name="state" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Zip Code</ion-label>
          <ion-input name="zip_code" required></ion-input>
        </ion-item>

        <input type="text" name="_gotcha" style="display:none;">

        <ion-button expand="block" id="pay-button" type="button">Bayar</ion-button>
      </form>
    </ion-card-content>
</ion-card>
    </ion-content>
  `;

  await modal.present();

  setTimeout(() => {
    const form = document.getElementById('checkout-form');
    const payButton = document.getElementById('pay-button');

    if (!form || !payButton) return;

    payButton.addEventListener('click', function () {
      const formData = new FormData(form);

      if (formData.get('_gotcha')) return;

      const buyer = {
        first_name: formData.get('first_name'),
        last_name: formData.get('last_name'),
        email: formData.get('email'),
        address: {
          street: formData.get('street'),
          city: formData.get('city'),
          state: formData.get('state'),
          postal_code: formData.get('zip_code')
        }
      };

      // Simpan ke localStorage
      localStorage.setItem('buyer', JSON.stringify(buyer));
      console.log('Buyer disimpan:', buyer);

      // MIDTRANS dan keranjang
      let items = [], total = 0;

      simpleCart.each(item => {
        items.push({
          id: item.get('id') || item.get('name'),
          name: item.get('name'),
          quantity: item.get('quantity'),
          price: item.get('price')
        });
        total += item.get('total');
      });

      if (items.length === 0) {
        showAlert("Keranjang masih kosong!");
        return;
      }

      fetch('/midtrans', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ total, items, customer: buyer })
      })
      .then(res => res.json())
      .then(data => {
        snap.pay(data.token, {
          onSuccess: () => {
            localStorage.removeItem('simpleCart_items');
            showAlert("Pembayaran berhasil!");
          },
          onPending: () => showAlert("Pembayaran tertunda."),
          onError: () => showAlert("Terjadi kesalahan."),
          onClose: () => showAlert("Pembayaran dibatalkan.")
        });
      })
      .catch(err => {
        showAlert("Gagal memulai pembayaran.");
        console.error(err);
      });
    });
  }, 100);
}

function dismissModal() {
  const modal = document.getElementById('checkoutModal');
  modal.dismiss();
}

function showAlert(msg) {
  alert(msg);
}
</script>
