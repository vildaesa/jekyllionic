---
title: Home
---
  <ion-tab tab="home">
    <div id="home-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>{{ page.title }}</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding" fullscreen="true">
          {% if page.categories != empty or page.tags != empty %}
                      <p class="entry-meta">{% include post-taxonomies.html %}</p>
          {% endif %}
      </ion-content>
    </div>
  </ion-tab>
