<!-- keranjang.html - Tampilan Cart dengan Ionic 8 -->
<style>
  /* Reset & perbaikan tampilan keranjang */
  .keranjang-box {
    background: transparent;
    padding: 0;
    margin: 0;
    width: 100%;
  }

  .keranjang-box ion-card.simpleCart_items {
    background: white;
    border-radius: 24px;
    margin: 0 0 1rem 0;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }

  /* Item cart */
  .keranjang-box .itemRow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-bottom: 1px solid #e9ecef;
    background: white;
  }

  .keranjang-box .item-thumb {
    flex-shrink: 0;
    width: 70px;
    height: 70px;
    border-radius: 16px;
    overflow: hidden;
    background: #f8f9fa;
  }

  .keranjang-box .item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .keranjang-box .item-details {
    flex: 1;
    min-width: 120px;
  }

  .keranjang-box .item-name {
    font-weight: 700;
    font-size: 0.9rem;
    color: #2c3e50;
    display: block;
    margin-bottom: 4px;
  }

  .keranjang-box .item-varian1,
  .keranjang-box .item-varian2,
  .keranjang-box .item-pilihan1,
  .keranjang-box .item-pilihan2 {
    font-size: 0.75rem;
    color: #6c757d;
    display: inline-block;
    margin-right: 8px;
  }

  .keranjang-box .item-price {
    font-size: 0.8rem;
    font-weight: 500;
    color: #495057;
  }

  /* Quantity control */
  .keranjang-box .quantity-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f1f3f5;
    border-radius: 40px;
    padding: 4px 8px;
    margin-top: 6px;
  }

  .keranjang-box .simpleCart_decrement,
  .keranjang-box .simpleCart_increment {
    width: 28px;
    height: 28px;
    background-size: 20px;
    background-position: center;
    background-repeat: no-repeat;
    cursor: pointer;
    text-indent: -9999px;
    background-color: transparent;
    border: none;
  }

  .keranjang-box .item-quantity {
    font-size: 1rem;
    font-weight: 600;
    min-width: 30px;
    text-align: center;
  }

  .keranjang-box .item-total {
    font-weight: 700;
    color: #e67e22;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  .keranjang-box .item-remove {
    margin-left: auto;
  }

  .keranjang-box .item-remove a.simpleCart_remove {
    display: block;
    width: 28px;
    height: 28px;
    background-size: 22px;
    opacity: 0.6;
    transition: opacity 0.2s;
  }

  .keranjang-box .item-remove a.simpleCart_remove:hover {
    opacity: 1;
  }

  /* Total dan tombol checkout */
  .keranjang-box .harga-total {
    background: white;
    border-radius: 24px;
    padding: 1rem;
    margin-top: 0.5rem;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
  }

  .keranjang-box .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .keranjang-box .total-label {
    font-size: 1rem;
    font-weight: 600;
    color: #2c3e50;
  }

  .keranjang-box .simpleCart_total {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--ion-color-primary, #3880ff);
  }

  .keranjang-box .simpleCart_quantity {
    font-weight: 700;
    color: #e67e22;
  }

  .keranjang-box ion-button.co-btn {
    --border-radius: 40px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0.5px;
    margin-top: 0.5rem;
  }

  .keranjang-box ion-text sub {
    color: #6c757d;
    font-size: 0.7rem;
  }

  /* Pesan kosong */
  .keranjang-box .empty-cart {
    text-align: center;
    padding: 2rem;
    color: #6c757d;
    font-size: 0.9rem;
  }

  /* Responsif kecil */
  @media (max-width: 480px) {
    .keranjang-box .itemRow {
      flex-direction: column;
      align-items: flex-start;
    }
    .keranjang-box .item-thumb {
      width: 100%;
      height: auto;
      max-height: 160px;
    }
    .keranjang-box .item-remove {
      align-self: flex-end;
    }
    .keranjang-box .item-total {
      white-space: normal;
    }
  }
</style>

<div class="keranjang-box simplecart-cart">
  <!-- Daftar item akan diisi oleh simpleCart otomatis ke dalam .simpleCart_items -->
  <ion-card class="simpleCart_items">
    <!-- simpleCart akan menambahkan .itemRow di sini -->
  </ion-card>

  <div class="harga-total">
    <div class="total-row">
      <span class="total-label">Grand Total :</span>
      <div>
        <span class="simpleCart_quantity"></span> item(s) = 
        <span class="simpleCart_total"></span>
      </div>
    </div>
    <ion-button class="co-btn" expand="block" onclick="openCheckoutModal()">
      CheckOut
    </ion-button>
    <ion-text class="ion-text-center">
      <sub>( *Belum Termasuk Ongkir )</sub>
    </ion-text>
  </div>
</div>
