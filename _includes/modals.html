<!-- Global Modals to avoid aria-hidden conflicts when nested in tabs -->

<!-- Modal untuk Blog Post -->
<ion-modal class="custom-fullscreen" id="postModal"></ion-modal>

<!-- Modal untuk Detail Produk (post_product.html) -->
<ion-modal class="custom-fullscreen" id="productModal"></ion-modal>

<!-- Modal untuk Checkout -->
<ion-modal class="custom-fullscreen" id="checkoutModal"></ion-modal>

<!-- Modal untuk Detail Produk Lama (product.html) -->
<ion-modal id="product-modal">
  <ion-header>
    <ion-toolbar>
      <ion-title>Detail Produk</ion-title>
      <ion-buttons slot="end">
        <ion-button onclick="document.getElementById('product-modal').dismiss()">
          <ion-icon slot="icon-only" name="close-circle-outline" color="danger"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <div class="post-product simpleCart_shelfItem" id="modal-product-content"></div>
  </ion-content>
</ion-modal>

<!-- Modal Login/Register -->
<ion-modal id="loginModal">
    <form onsubmit="event.preventDefault(); login();">
  <ion-header>
    <ion-toolbar>
      <ion-title>Akses Akun</ion-title>
      <ion-buttons slot="end">
        <ion-button onclick="document.getElementById('loginModal').dismiss()">
          <ion-icon slot="icon-only" name="close-circle-outline" color="danger"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="content-form-modal ion-no-padding">
      <ion-card class="modal-form-card" style="margin: 0; border-radius: 16px; box-shadow: none;">
        <ion-card-header>
          <ion-card-title>
            <ion-icon name="key-outline"></ion-icon>
            Masuk / Daftar
          </ion-card-title>
          <ion-card-subtitle>Gunakan email & password untuk mengakses akun Anda</ion-card-subtitle>
        </ion-card-header>

        <ion-card-content>
          <ion-list lines="full">
            <!--<ion-item>
              <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
              <ion-label position="stacked">Nama Lengkap</ion-label>
              <ion-input id="full_name" type="text" placeholder="Masukkan nama lengkap Anda"></ion-input>
            </ion-item>-->

            <ion-item>
              <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
              <ion-label position="stacked">Email</ion-label>
              <ion-input id="email" type="email" placeholder="contoh@email.com" required autocomplete="email"></ion-input>
            </ion-item>

            <ion-item>
              <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
              <ion-label position="stacked">Password</ion-label>
              <ion-input id="password" type="password" placeholder="Minimal 6 karakter" required autocomplete="current-password"></ion-input>
            </ion-item>
          </ion-list>

          <div id="user-info" class="user-status"></div>
        </ion-card-content>
      </ion-card>
  </ion-content>

        <ion-footer>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-button type="button" fill="outline" color="primary" onclick="register()">
                <ion-icon slot="start" name="person-add-outline"></ion-icon>
                Daftar
              </ion-button>
            </ion-buttons>
            <ion-buttons slot="end">
              <ion-button type="submit" fill="solid" color="success">
                <ion-icon slot="start" name="log-in-outline"></ion-icon>
                Masuk
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-footer>
    </form>
</ion-modal>

<script>
  document.addEventListener('ionModalWillPresent', (ev) => {
    ev.target.removeAttribute('aria-hidden');
  });
</script>
