
<div class="container product-grid">
  {% for product in site.products %}
    <ion-card class="text-center" onclick='openProductModal({
      title: "{{ product.title }}",
      price: "{{ product.price }}",
      url: "{{ product.url }}",
      model: {{ product.model | jsonify }},
      styles: {{ product.styles | jsonify }},
      description: "{{ product.description }}"
    })' style="cursor:pointer;">
      <img class="img_product" src="{{ product.featured_image_path }}" loading="lazy" alt="{{ product.title }}">
      <ion-card-content>
        <ion-card-title>Rp {{ product.price }}</ion-card-title>
        <ion-card-subtitle>{{ product.title }}</ion-card-subtitle>
      </ion-card-content>
    </ion-card>
  {% endfor %}
</div>

<script>
  async function openProductModal(product) {
    const modal = document.getElementById('productModal');

    // Membangun konten modal dengan tampilan baru
    modal.innerHTML = `
      <ion-header translucent>
        <ion-toolbar>
          <ion-title>${product.title}</ion-title>
          <ion-buttons slot="end">
            <ion-button onclick="closeModal()">
              <ion-icon slot="icon-only" color="danger" name="close-circle-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding modal-product-content">
        <div class="product-detail-layout">
          <!-- Gambar utama -->
          <div id="product-image-container">
            <img id="main-product-image" src="${product.styles[0].image_path}" alt="${product.title}">
          </div>

          <!-- Detail produk -->
          <ion-card class="product-detail-panel ion-no-margin">
            <ion-card-content>
              <div class="price-text">Rp ${product.price}</div>
              <div class="description-text">${product.description || ''}</div>

              <!-- Pilihan warna -->
              <div class="color-picker-group">
                <p>Warna :</p>
                <div class="color-buttons" id="color-buttons-container">
                  ${product.styles.map((style, i) => `
                    <button onclick="selectColor('${style.color}', '${style.image_path}', this)" 
                      class="color-button ${i === 0 ? 'active' : ''}" 
                      style="background:${style.name};">
                    </button>
                  `).join('')}
                </div>
                <input type="hidden" id="selected_color" value="${product.styles[0].color}" />
                <input type="hidden" id="selected_thumb" value="${product.styles[0].image_path}" />
              </div>

              <!-- Pilihan model (tali) -->
              <div class="model-picker-group">
                <p>Tali :</p>
                <div class="model-buttons" id="model-buttons-container">
                  ${product.model.map((modelName, i) => `
                    <button class="model-button ${i === 0 ? 'active' : ''}" onclick="selectModel(this, '${modelName}')">${modelName}</button>
                  `).join('')}
                </div>
                <input type="hidden" id="selected_model" value="${product.model[0]}" />
              </div>
            </ion-card-content>
          </ion-card>
        </div>
      </ion-content>

      <ion-footer class="footer-actions">
        <ion-toolbar>
          <div class="container" style="display: flex; justify-content: space-between; align-items: center; padding: 4px 12px;">
            <div class="quantity-picker">
            <ion-buttons slot="start">
              <ion-button type="button" onclick="updateQuantity(-1)">
                <ion-icon slot="icon-only" name="remove-circle" color="primary"></ion-icon>
              </ion-button>
            </ion-buttons>
              <input type="number" class="item_quantity" id="item_quantity_input" value="1" min="1" readonly />
            <ion-buttons slot="end">
              <ion-button type="button" onclick="updateQuantity(1)">
                <ion-icon slot="icon-only" name="add-circle" color="primary"></ion-icon>
              </ion-button>
            </ion-buttons>
            </div>
            <ion-buttons slot="end">
              <ion-button id="item_add" fill="solid" color="primary">Tambahkan</ion-button>
            </ion-buttons>
          </div>
        </ion-toolbar>
      </ion-footer>
    `;

    await modal.present();

    // Pasang event listener add to cart (tetap sama)
    document.getElementById('item_add').addEventListener('click', function () {
      const model = document.getElementById('selected_model').value;
      const qty = parseInt(document.getElementById('item_quantity_input').value, 10);
      const color = document.getElementById('selected_color').value;
      const thumb = document.getElementById('selected_thumb').value;

      simpleCart.add({
        name: product.title,
        price: product.price,
        model: model,
        color: color,
        quantity: qty,
        thumb: thumb,
        link: product.url
      });

      closeModal();
    });
  }

  function closeModal() {
    const modal = document.getElementById('productModal');
    if (modal) modal.dismiss();
  }

  function selectColor(color, imagePath, button) {
    document.getElementById('main-product-image').src = imagePath;
    document.getElementById('selected_color').value = color;
    document.getElementById('selected_thumb').value = imagePath;

    document.querySelectorAll('.color-button').forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
  }

  function selectModel(button, model) {
    document.querySelectorAll('.model-button').forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
    document.getElementById('selected_model').value = model;
  }

  function updateQuantity(change) {
    const input = document.getElementById('item_quantity_input');
    let current = parseInt(input.value, 10);
    let newVal = current + change;
    if (newVal < 1) newVal = 1;
    input.value = newVal;
  }
</script>
