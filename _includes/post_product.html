<div class="product-grid">
{% for product in site.products %}
 <ion-card onclick='openProductModal({
  title: "{{ product.title }}",
  price: "{{ product.price }}",
  url: "{{ product.url }}",
  model: {{ product.model | jsonify }},
  styles: {{ product.styles | jsonify }},
  description: "{{ product.description }}"
})'>
  <img src="{{ product.featured_image_path }}">
  <ion-card-content>
<ion-card-title>Rp {{ product.price }}</ion-card-title>
<ion-card-subtitle>{{ product.title }}</ion-card-subtitle>
</ion-card-content>
</ion-card>
{% endfor %}
</div>

<ion-modal id="productModal"></ion-modal>

<style>
  .color-picker {
    display: inline-block;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    margin: 0 4px;
    border: 2px solid #ccc;
    cursor: pointer;
  }

  .quantity-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1em;
  }

  .quantity-picker button {
    width: 32px;
    height: 32px;
    font-size: 18px;
    font-weight: bold;
    background-color: #f0f0f0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .quantity-picker input {
    width: 48px;
    text-align: center;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background-color: transparent;
  }

  .model-picker {
    display: flex;
    gap: 8px;
    margin-bottom: 1em;
  }

  .model-button {
    padding: 6px 12px;
    border: 1px solid #ccc;
    background-color: #fff;
    border-radius: 4px;
    cursor: pointer;
  }

  .model-button.active {
    background-color: #333;
    color: #fff;
    border-color: #333;
  }
</style>

<script>
  async function openProductModal(product) {
    const modal = document.getElementById('productModal');

    modal.innerHTML = `
      <ion-header translucent>
        <ion-toolbar>
          <ion-title>${product.title}</ion-title>
          <ion-buttons slot="end">
            <ion-button onclick="dismissModal()">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <div id="product-image-container">
          <img id="main-product-image" src="${product.styles[0].image_path}" style="width:100%; border-radius: 12px;" />
        </div>

        <p>Harga: <strong>Rp ${product.price}</strong></p>
        <p>${product.description || ''}</p>

        <div>
          <p>Warna:</p>
          <div style="display:flex; gap:10px;">
            ${product.styles.map((style, i) => `
              <button onclick="selectColor('${style.color}', '${style.image_path}', this)" 
                class="color-button" 
                style="background:${style.color}; width:30px; height:30px; border-radius:50%; border:2px solid #ccc;">
              </button>
            `).join('')}
          </div>
          <input type="hidden" id="selected_color" value="${product.styles[0].color}" />
          <input type="hidden" id="selected_thumb" value="${product.styles[0].image_path}" />
        </div>

        <div style="margin-top:1em;">
          <p>Tali:</p>
          <div style="display:flex; gap:10px; flex-wrap:wrap;" id="model-buttons">
            ${product.model.map((modelName, i) => `
              <button class="model-button ${i === 0 ? 'active' : ''}" onclick="selectModel(this, '${modelName}')">${modelName}</button>
            `).join('')}
          </div>
          <input type="hidden" id="selected_model" value="${product.model[0]}" />
        </div>

        <div style="margin-top:1em;">
          <p>Jumlah:</p>
<div class="quantity-picker">
  <button type="button" onclick="updateQuantity(-1)">–</button>
  <input type="number" class="item_quantity" id="item_quantity_input" value="1" min="1" readonly />
  <button type="button" onclick="updateQuantity(1)">+</button>
</div>
        </div>

        <ion-button id="item_add" expand="block" color="primary" style="margin-top: 2em;">Tambah ke Keranjang</ion-button>
      </ion-content>
    `;

    await modal.present();

    // Bersihkan dan pasang ulang event add-to-cart
    document.getElementById('item_add').addEventListener('click', function () {
      const model = document.getElementById('selected_model').value;
      const qty = parseInt(document.getElementById('item_quantity_input').value, 10);
      const color = document.getElementById('selected_color').value;
      const thumb = document.getElementById('selected_thumb').value;

      simpleCart.add({
        name: product.title,
        price: product.price,
        model: model,
        color: name,
        quantity: qty,
        thumb: thumb,
        link: product.url
      });

      dismissModal();
    });
  }

  function dismissModal() {
    const modal = document.getElementById('productModal');
    modal.dismiss();
  }

  function selectColor(color, imagePath, button) {
    document.getElementById('main-product-image').src = imagePath;
    document.getElementById('selected_color').value = name;
    document.getElementById('selected_thumb').value = imagePath;

    document.querySelectorAll('.color-button').forEach(btn => btn.style.border = "2px solid #ccc");
    button.style.border = "3px solid black";
  }

  function selectModel(button, model) {
    document.querySelectorAll('.model-button').forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
    document.getElementById('selected_model').value = model;
  }

function updateQuantity(change) {
  const input = document.getElementById('item_quantity_input');
  let current = parseInt(input.value, 10);
  let newVal = current + change;
  if (newVal < 1) newVal = 1;
  input.value = newVal;
}
</script>
