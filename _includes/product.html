{% for product in site.products %}
  <ion-card class="entry one-third styles" onclick='openProductModal({{ product | jsonify | escape }})'>
    <div class="style">
      <img src="{{ product.featured_image_path }}" itemprop="image">
    </div>
    <ion-card-content class="product-details">
      <div class="product-name">
        <h4>{{ product.title }}</h4>
      </div>
      <div class="product-price">
        <p>Rp. {{ product.price }}</p>
      </div>
    </ion-card-content>
  </ion-card>
{% endfor %}

  <ion-modal id="product-modal" trigger="open-product">
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ page.title }}</ion-title>
        <ion-buttons slot="end">
          <ion-button onclick="dismissModal()"><ion-icon slot="icon-only" name="close-circle-outline"></ion-icon></ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <div id="modal-product-content"></div>
    </ion-content>
</ion-modal>

<style>
  .color-picker {
    display: inline-block;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    margin: 0 4px;
    border: 2px solid #ccc;
    cursor: pointer;
  }

  .quantity-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1em;
  }

  .quantity-picker button {
    width: 32px;
    height: 32px;
    font-size: 18px;
    font-weight: bold;
    background-color: #f0f0f0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .quantity-picker input {
    width: 48px;
    text-align: center;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background-color: transparent;
  }

  .size-picker {
    display: flex;
    gap: 8px;
    margin-bottom: 1em;
  }

  .size-button {
    padding: 6px 12px;
    border: 1px solid #ccc;
    background-color: #fff;
    border-radius: 4px;
    cursor: pointer;
  }

  .size-button.active {
    background-color: #333;
    color: #fff;
    border-color: #333;
  }
</style>

<script>
  async function openProductModal(product) {
    const styles = product.styles.map((style, index) => `
      <div id="style-image-${index}" class="style-image" style="${index !== 0 ? 'display:none;' : ''}">
        <img src="${style.image_path}" itemprop="image" style="max-width: 100%;" />
      </div>
    `).join('');

    const colorPickers = product.styles.map((style, index) => `
      <div class="color-picker" style="background-color:${style.color}" onclick="changeStyleImage(${index})"></div>
    `).join('');

    const sizes = product.sizes.map(size => `
      <option value="${size}">${size}</option>
    `).join('');

    const content = `
      <section class="product-image">
        <div class="styles">${styles}</div>
      </section>

      <section class="product-details">
        <h1 class="entry-title item_name">${product.title}</h1>
        <p class="item_price">Rp. ${product.price}</p>
        <p>${product.description || ''}</p>

        <div class="style-picker">
          <p class="margin-bottom-0">Color:</p>
          ${colorPickers}
        </div>

  <p class="margin-bottom-0">Size:</p>
<div class="size-picker">
  ${product.sizes.map(size => `
    <button type="button" class="size-button" onclick="selectSize(this, '${size}')">${size}</button>
  `).join('')}
</div>
<input type="hidden" id="selected_size" class="item_size" value="${product.sizes[0]}" />

  <p class="margin-bottom-0">Quantity:</p>
<div class="quantity-picker">
  <button type="button" onclick="updateQuantity(-1)">–</button>
  <input type="number" id="item_quantity_input" value="1" min="1" readonly />
  <button type="button" onclick="updateQuantity(1)">+</button>
</div>

        <a id="item_add" class="item_add button" href="javascript:;">Add to Cart</a>
      </section>
    `;

    document.getElementById('modal-product-content').innerHTML = content;
    await document.getElementById('product-modal').present();
  }

  function changeStyleImage(index) {
    document.querySelectorAll('.style-image').forEach((el, i) => {
      el.style.display = i === index ? 'block' : 'none';
    });
  }

function selectSize(button, size) {
  document.querySelectorAll('.size-button').forEach(btn => btn.classList.remove('active'));
  button.classList.add('active');
  document.getElementById('selected_size').value = size;
}

function updateQuantity(change) {
  const input = document.getElementById('item_quantity_input');
  let current = parseInt(input.value, 10);
  let newVal = current + change;
  if (newVal < 1) newVal = 1;
  input.value = newVal;
}

  function dismissModal() {
    document.getElementById('product-modal').dismiss();
  }
</script>
