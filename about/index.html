---
layout: default
title: Tentang Repo
permalink: /about
---

<!-- Struktur Struktur UI Ionic -->
<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Tentang Repo</ion-card-title>
    </ion-card-header>
    
    <ion-card-content>
      <!-- Tempat menampung hasil render README.md -->
      <div id="readme-content">Memuat konten...</div>
    </ion-card-content>
  </ion-card>
</ion-content>

<script>
document.addEventListener("DOMContentLoaded", function () {
    fetch('{{site.baseurl}}/assets/README.md')
        .then(response => response.text())
        .then(markdown => {
            // Memastikan library marked sudah siap sebelum parsing
            if (typeof marked !== 'undefined') {
                document.getElementById('readme-content').innerHTML = marked.parse(markdown);
            } else {
                document.getElementById('readme-content').innerHTML = "Gagal memuat parser Markdown.";
            }
        })
        .catch(error => {
            console.error('Error loading README.md:', error);
            document.getElementById('readme-content').innerHTML = "Gagal memuat konten.";
        });
});
</script>
