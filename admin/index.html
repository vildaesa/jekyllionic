<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <!-- Ionic Framework -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* Styling untuk tabel dan tata letak agar rapi tanpa Tailwind */
    .table-container { overflow-x: auto; padding: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    .modal-content { --max-width: 800px; }
  </style>
</head>
<body>

<ion-app>
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Dashboard Produk</ion-title>
      <ion-buttons slot="end">
        <ion-button id="logoutBtn" color="light">Logout</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <!-- Tab Switcher -->
    <ion-segment value="products" id="tabSwitcher">
      <ion-segment-button value="products" id="showProductsBtn">
        <ion-label>Produk</ion-label>
      </ion-segment-button>
      <ion-segment-button value="posts" id="showPostsBtn">
        <ion-label>Blog Posts</ion-label>
      </ion-segment-button>
    </ion-segment>

    <div class="ion-margin-vertical">
      <ion-button id="openCreateModal" color="success">
        <ion-icon slot="start" name="add-outline"></ion-icon> Tambah Baru
      </ion-button>
    </div>

    <!-- Tabel -->
    <ion-card>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Gambar</th>
              <th>Judul</th>
              <th>Harga</th>
              <th>Kategori</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </div>
    </ion-card>
  </ion-content>
</ion-app>

<!-- Modal Create/Edit -->
<ion-modal id="productModal" trigger="openCreateModal" class="modal-content">
  <ion-header>
    <ion-toolbar>
      <ion-title id="modalTitle">Tambah Item Baru</ion-title>
      <ion-buttons slot="end">
        <ion-button id="closeModalBtn">Tutup</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <form id="productForm">
      <ion-item>
        <ion-label position="stacked">Judul*</ion-label>
        <ion-input id="title" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Harga*</ion-label>
        <ion-input id="price"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Deskripsi*</ion-label>
        <ion-textarea id="description" rows="5"></ion-textarea>
      </ion-item>
      <!-- Tambahkan item input lainnya sesuai kebutuhan -->
      <ion-button expand="block" type="submit" class="ion-margin-top">Simpan Produk</ion-button>
    </form>
  </ion-content>
</ion-modal>

<ion-alert id="globalAlert"></ion-alert>

<script src="{{ '/assets/js/admin.js' | relative_url }}"></script>
<script>
  function showAlert(message, header = "Info") {
    const alert = document.getElementById('globalAlert');
    alert.header = header;
    alert.message = message;
    alert.buttons = ['OK'];
    alert.present();
  }
</script>
</body>
</html>
