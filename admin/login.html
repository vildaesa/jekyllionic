<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>

  <!-- Ionic Framework CDN -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css" />
  
  <style>
    /* CSS kustom untuk memastikan container berada di tengah */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <ion-app>
    <ion-content>
      <div class="login-container">
        <div class="login-card">
          <h1 class="ion-text-center">Admin Login</h1>
          
          <form id="loginForm">
            <ion-item>
              <ion-label position="stacked">Email</ion-label>
              <ion-input id="email" type="email" placeholder="email@example.com" required></ion-input>
            </ion-item>

            <ion-item class="ion-margin-bottom">
              <ion-label position="stacked">Password</ion-label>
              <ion-input id="password" type="password" placeholder="********" required></ion-input>
            </ion-item>

            <ion-button expand="block" type="submit">
              Login
            </ion-button>
          </form>

          <div id="errorMsg" class="ion-padding-top ion-text-center" style="color: var(--ion-color-danger); display: none;"></div>
        </div>
      </div>
    </ion-content>
  </ion-app>

  <ion-alert id="globalAlert"></ion-alert>

  <script>
    const API_BASE_URL = 'https://admin-dashboard.vildaesa.workers.dev';
    const loginForm = document.getElementById('loginForm');
    const errorMsgDiv = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');
        
        localStorage.setItem('adminToken', data.token);
        window.location.href = '{{ "/admin" | relative_url }}';
      } catch (err) {
        showAlert(err.message, "Gagal Login");
        errorMsgDiv.textContent = err.message;
        errorMsgDiv.style.display = 'block';
      }
    });

    async function showAlert(message, header = "Info") {
      const alert = document.getElementById('globalAlert');
      alert.header = header;
      alert.message = message;
      alert.buttons = ['OK'];
      await alert.present();
    }
  </script>
</body>
</html>
