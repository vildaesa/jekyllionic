---
layout: default
title: Pembayaran Sukses
permalink: /success
---
<div class="center-content">
  <ion-card class="success-card">
    <ion-card-content>
      <div class="box">
        <img class="gifImg" src="{{ '/assets/images/success.gif' | relative_url }}" />
        <h2>Pembayaran Berhasil!</h2>

        <div class="simpleCart_items" style="display:none;"></div>
        <p>Total Bayar: <span class="simpleCart_total"></span></p>
<ion-button expand="block" color="success" onclick="konfirmasiViaWA()">
  Konfirmasi via WhatsApp
</ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</div>

<script>
  function konfirmasiViaWA() {
    const buyer = JSON.parse(localStorage.getItem("buyer")) || {};

    const firstName = buyer.first_name || "";
    const lastName = buyer.last_name || "";
    const email = buyer.email || "";
    const address = buyer.billing_address || {};
    const street = address.street || '';
    const city = address.city || '';
    const state = address.state || '';
    const zip = address.postal_code || '';

    let message = `Halo, saya ingin konfirmasi pembayaran:\n\n`;
    message += `Nama: ${firstName} ${lastName}\n`;
    message += `Email: ${email}\n`;
    message += `Alamat: ${street}\n${city}\n${state} ${zip}\n\n`;
    message += `Detail Pesanan:\n---`;

    let total = 0;
    let itemCount = 0;

    simpleCart.each(function (item) {
      const name = item.get("name");
      const warna = item.get("color");
      const varian = item.get("model");
      const quantity = item.get("quantity");
      const price = item.get("price");
      const subtotal = item.get("total");
      total += subtotal;
      itemCount++;

      message += `\n- *Produk ${name}*,\n- *Warna ${warna}*,\n- *Model ${varian}*,\n ${quantity} pcs *x* @Rp. ${price} = *Total harga Rp. ${subtotal}*\n---`;
    });

    if (itemCount === 0) {
      showAlert("Keranjang kosong. Tidak ada data untuk dikirim.");
      return;
    }

    message += `\nTotal Pembayaran: Rp${total}`;

    const phoneNumber = "{{ site.wa_admin }}";
    const encodedMessage = encodeURIComponent(message);
    const waLink = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

    window.open(waLink, "_blank");

    // Kosongkan keranjang dan redirect
    simpleCart.empty();
    localStorage.removeItem("buyer");

    setTimeout(function () {
      window.location.href = "/";
    }, 2000);
  }
</script>
